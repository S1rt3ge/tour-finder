name: Telegram notifications

on:
  schedule:
    # Avoid the busiest start-of-hour interval; GitHub schedules remain best-effort.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch: {}
  workflow_run:
    workflows: [collect]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: telegram-notifications
  cancel-in-progress: false

jobs:
  notify:
    # workflow_run can carry secrets: accept only this repository's successful
    # main collector. Scheduled and explicitly dispatched runs remain allowed.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ALLOWED_USER_IDS: ${{ secrets.TELEGRAM_ALLOWED_USER_IDS }}
      TELEGRAM_APP_URL: ${{ vars.TELEGRAM_APP_URL || 'https://tour-finder-rose.vercel.app/app' }}
    steps:
      - name: Skip until Telegram is configured
        if: env.DATABASE_URL == '' || env.TELEGRAM_BOT_TOKEN == '' || env.TELEGRAM_ALLOWED_USER_IDS == ''
        run: echo 'Telegram delivery is not configured; no database or Bot API requests made.'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: env.DATABASE_URL != '' && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_ALLOWED_USER_IDS != ''
        with:
          # For workflow_run, github.sha is the default-branch commit, not an
          # untrusted upstream head. Do not download upstream run artifacts.
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: env.DATABASE_URL != '' && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_ALLOWED_USER_IDS != ''
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install application
        if: env.DATABASE_URL != '' && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_ALLOWED_USER_IDS != ''
        run: python -m pip install -e .
      - name: Evaluate saved searches and deliver verified alerts
        if: env.DATABASE_URL != '' && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_ALLOWED_USER_IDS != ''
        run: python -m tourfinder.telegram_delivery
