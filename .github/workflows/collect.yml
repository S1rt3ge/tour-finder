name: collect

on:
  schedule:
    # Every 2 hours. `collect` decides which direct tiers or exact discovery
    # parts are due (4h / 12h / 24h) and exits fast when nothing is.
    - cron: "17 */2 * * *"
  workflow_dispatch: {}

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # Leave time for an in-flight upstream request/retry to unwind and persist
    # an incomplete run after the cooperative 50-minute collector deadline.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: run collector
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_ALLOWED_USER_IDS: ${{ secrets.TELEGRAM_ALLOWED_USER_IDS }}
        # Exact demand parts are bounded to 8 requests / 3 minutes each.
        # Allow more small parts without increasing the invocation time cap.
        run: python -m tourfinder.cli collect --max-tasks 96 --max-minutes 50
      - name: assert data is fresh
        if: always()
        # Check direct tiers and exact discovery keys separately. Discovery
        # completion is not proof of exhaustive source inventory.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_ALLOWED_USER_IDS: ${{ secrets.TELEGRAM_ALLOWED_USER_IDS }}
        run: python -m tourfinder.cli assert-fresh --hours 26
