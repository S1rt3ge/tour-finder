name: Inspect database storage

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: inspect-database-storage
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install standalone driver
        run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Read aggregate storage measurements
        run: python scripts/inspect_storage.py
