name: collect

on:
  schedule:
    # Every 2 hours. `collect` itself decides which tiers are due
    # (near 4h / mid 12h / far 24h) and exits fast when nothing is.
    - cron: "17 */2 * * *"
  workflow_dispatch: {}

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # Leave time for an in-flight upstream request/retry to unwind and persist
    # an incomplete run after the cooperative 50-minute collector deadline.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: run collector
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m tourfinder.cli collect --max-tasks 6 --max-minutes 50
      - name: assert data is fresh
        if: always()
        # Check every source/tier/party, not merely one recent snapshot.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m tourfinder.cli assert-fresh --hours 26
