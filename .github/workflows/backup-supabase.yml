name: One-time encrypted Supabase archive

on:
  push:
    branches: [backup/supabase-2026-10-08]
    paths:
      - .github/workflows/backup-supabase.yml
      - scripts/backup_supabase.py
      - backup-public.pem
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-supabase-2026-10-08
  cancel-in-progress: false

jobs:
  encrypted-backup:
    if: github.repository == 'S1rt3ge/tour-finder' && github.ref == 'refs/heads/backup/supabase-2026-10-08'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned backup dependencies
        run: python -m pip install --disable-pip-version-check 'psycopg[binary]==3.3.6' 'cryptography==50.0.2'
      - name: Read-only export, isolated restore verification, and encryption
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/backup_supabase.py --public-key backup-public.pem --output-dir "$RUNNER_TEMP/tour-finder-encrypted-backup"
      - name: Upload encrypted archive only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tour-finder-supabase-encrypted-2026-10-08-${{ github.run_id }}
          path: ${{ runner.temp }}/tour-finder-encrypted-backup/tour-finder-supabase-public-2026-10-08-${{ github.run_id }}.tfbackup
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
