name: Archive tour history

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Export only, or prune exact verified archived rows
        type: choice
        options: [export, prune]
        default: export
        required: true
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: write

concurrency:
  group: archive-history
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      APP_ARCHIVE_KEY: ${{ secrets.APP_ARCHIVE_KEY }}
      TOUR_ARCHIVE_MANIFEST_URL: ${{ vars.TOUR_ARCHIVE_MANIFEST_URL }}
      ARCHIVE_ROTATION_ENABLED: ${{ vars.ARCHIVE_ROTATION_ENABLED }}
      ARCHIVE_PRUNE_ENABLED: ${{ vars.ARCHIVE_PRUNE_ENABLED }}
      REQUESTED_MODE: ${{ inputs.mode || 'prune' }}
    steps:
      - name: Check configuration and explicit schedule opt-in
        id: configuration
        shell: bash
        run: |
          if [[ -z "$DATABASE_URL" || -z "$APP_ARCHIVE_KEY" || -z "$TOUR_ARCHIVE_MANIFEST_URL" ]]; then
            echo 'Archive is not configured; no database or publication requests made.'
            exit 0
          fi
          if [[ "$GITHUB_EVENT_NAME" == schedule && ( "$ARCHIVE_ROTATION_ENABLED" != true || "$ARCHIVE_PRUNE_ENABLED" != true ) ]]; then
            echo 'Scheduled archive rotation is not enabled; no database requests made.'
            exit 0
          fi
          if [[ "$REQUESTED_MODE" == prune && "$ARCHIVE_PRUNE_ENABLED" != true ]]; then
            echo 'Pruning is not enabled; select export for a read-only source export.'
            exit 0
          fi
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.configuration.outputs.ready == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: steps.configuration.outputs.ready == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install application
        if: steps.configuration.outputs.ready == 'true'
        run: python -m pip install -e .
      - name: Export, verify published archive, and optionally prune
        if: steps.configuration.outputs.ready == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m tourfinder.archive_rotation --mode "$REQUESTED_MODE"
      # Plaintext databases and deletion plans are never uploaded as artifacts.
