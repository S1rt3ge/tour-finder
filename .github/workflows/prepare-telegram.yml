name: Prepare Telegram database

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Check only, or apply additive Telegram schema changes
        type: choice
        options: [preflight, apply]
        default: preflight
        required: true
      build_index:
        description: Also build the large snapshot index concurrently (apply only)
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: prepare-telegram-database
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PREPARE_MODE: ${{ inputs.mode }}
      BUILD_INDEX: ${{ inputs.build_index }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install standalone database driver
        run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Check or prepare database
        shell: bash
        run: |
          args=(--mode "$PREPARE_MODE")
          if [[ "$BUILD_INDEX" == 'true' ]]; then args+=(--build-index); fi
          python scripts/prepare_telegram.py "${args[@]}"
