name: Maintain tour storage

on:
  workflow_dispatch:
    inputs:
      action:
        description: Inspect only, replace the redundant snapshot index, or compact one table
        type: choice
        options: [preflight, replace-index, vacuum-offers, vacuum-snapshots]
        default: preflight
        required: true
      verified_prune:
        description: Archive verification and the intended pruning have completed successfully
        type: boolean
        default: false
      disk_free_mib:
        description: Free disk MiB from a fresh Supabase Dashboard measurement (apply only)
        type: string
        default: ''
      disk_measured_at:
        description: UTC time of that measurement, e.g. 2026-10-09T12:30:00Z (must be within 10 minutes)
        type: string
        default: ''

permissions:
  contents: read

# Matches the collector workflow. Archive writes must also finish before the
# operator starts maintenance; database lock/activity checks enforce the guard.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ACTION: ${{ inputs.action }}
      VERIFIED_PRUNE: ${{ inputs.verified_prune }}
      DISK_FREE_MIB: ${{ inputs.disk_free_mib }}
      DISK_MEASURED_AT: ${{ inputs.disk_measured_at }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install standalone database driver
        run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Inspect or maintain the fixed tour database
        shell: bash
        run: |
          args=(--action "$ACTION")
          if [[ "$VERIFIED_PRUNE" == true ]]; then args+=(--verified-prune); fi
          if [[ -n "$DISK_FREE_MIB" ]]; then args+=(--disk-free-mib "$DISK_FREE_MIB"); fi
          if [[ -n "$DISK_MEASURED_AT" ]]; then args+=(--disk-measured-at "$DISK_MEASURED_AT"); fi
          python scripts/maintain_storage.py "${args[@]}"
      # No database rows, SQL text, credentials, or plaintext artifacts upload.
